<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard – TotahDa</title>
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <img src="images/driver.png" alt="TotahDa" class="logo-img" />
        <span>TotahDa</span>
      </div>
      <nav>
        <a href="index.html" class="nav-link">Book a Driver</a>
        <a href="admin.html" class="nav-link active">Admin</a>
      </nav>
    </div>
  </header>

  <!-- ===== ADMIN LOGIN SCREEN ===== -->
  <div id="adminLoginScreen" class="login-screen">
    <div class="login-card">
      <img src="images/driver.png" alt="TotahDa Driver" class="login-driver-img" />
      <h2 class="login-title">Admin Portal</h2>
      <p class="login-sub">Enter your PIN to access the dashboard</p>
      <div class="form-group">
        <label for="adminPin">Admin PIN</label>
        <input type="password" id="adminPin" placeholder="••••" class="pin-input" />
        <span class="field-error" id="err-adminPin"></span>
      </div>
      <button class="btn btn-primary btn-full" style="margin-top:20px;" onclick="adminLogin()">
        🔓 Login to Dashboard
      </button>
    </div>
  </div>

  <!-- ===== ADMIN MAIN ===== -->
  <main class="main-content" id="adminMain" style="display:none;">
    <div class="card admin-card">
      <div class="admin-header">
        <div class="admin-title-row">
          <img src="images/driver.png" alt="" class="admin-avatar" />
          <div>
            <h1 class="card-title">All Bookings</h1>
            <p class="card-subtitle" id="bookingCount">Loading…</p>
          </div>
        </div>
        <div class="admin-actions">
          <input type="text" id="searchInput" class="search-input"
            placeholder="Search by name or phone…" oninput="filterBookings()" />
          <button class="btn btn-danger" onclick="clearAllBookings()">Clear All</button>
        </div>
      </div>

      <!-- Stats bar -->
      <div class="stats-bar" id="statsBar"></div>

      <!-- Table -->
      <div class="table-wrapper">
        <table class="bookings-table" id="bookingsTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Phone</th>
              <th>Date</th>
              <th>Time</th>
              <th>Status</th>
              <th>Driver</th>
              <th>Booked At</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="bookingsBody"></tbody>
        </table>
        <div id="emptyState" class="empty-state hidden">
          <img src="images/driver.png" alt="" class="empty-driver-img" />
          <p>No bookings yet. Waiting for riders!</p>
        </div>
      </div>
    </div>
  </main>

  <!-- SMS Toast -->
  <div id="smsToast" class="sms-toast hidden"></div>

  <!-- Confirm delete modal -->
  <div id="deleteModal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-icon">⚠️</div>
      <h2>Delete Booking?</h2>
      <p>This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=5"></script>
  <script src="admin.js?v=5"></script>
  <script>
    if (sessionStorage.getItem('totahda_admin') === '1') {
      document.getElementById('adminLoginScreen').style.display = 'none';
      document.getElementById('adminMain').style.display = '';
    }
    function adminLogin() {
      const pin = document.getElementById('adminPin').value.trim();
      const err = document.getElementById('err-adminPin');
      if (pin === '100') {
        sessionStorage.setItem('totahda_admin', '1');
        document.getElementById('adminLoginScreen').style.display = 'none';
        document.getElementById('adminMain').style.display = '';
        renderBookings();
      } else {
        document.getElementById('adminPin').classList.add('invalid');
        err.textContent = 'Incorrect PIN. Please try again.';
      }
    }
    document.getElementById('adminPin').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') adminLogin();
    });
  </script>
</body>
</html>
