<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard – TotahDa</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">🚗 TotahDa</div>
      <nav>
        <a href="index.html" class="nav-link">Book a Driver</a>
        <a href="admin.html" class="nav-link active">Admin Dashboard</a>
      </nav>
    </div>
  </header>

  <!-- Admin Login Screen -->
  <div id="adminLoginScreen" class="modal-overlay" style="background:#f0f2f5;">
    <div class="card" style="max-width:380px;width:100%;padding:40px 36px;text-align:center;">
      <div style="font-size:2.5rem;margin-bottom:12px;">🔐</div>
      <h2 style="margin-bottom:6px;">Admin Login</h2>
      <p style="color:#57606a;font-size:0.9rem;margin-bottom:24px;">Enter your admin PIN to continue.</p>
      <div class="form-group" style="text-align:left;">
        <label for="adminPin">Admin PIN</label>
        <input type="password" id="adminPin" placeholder="Enter PIN" style="width:100%" />
        <span class="field-error" id="err-adminPin"></span>
      </div>
      <button class="btn btn-primary btn-full" style="margin-top:16px;" onclick="adminLogin()">Login</button>
    </div>
  </div>

  <main class="main-content" id="adminMain" style="display:none;">
    <div class="card admin-card">
      <div class="admin-header">
        <div>
          <h1 class="card-title">All Bookings</h1>
          <p class="card-subtitle" id="bookingCount">Loading…</p>
        </div>
        <div class="admin-actions">
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Search by name or phone…"
            oninput="filterBookings()"
          />
          <button class="btn btn-danger" onclick="clearAllBookings()">Clear All</button>
        </div>
      </div>

      <!-- Stats bar -->
      <div class="stats-bar" id="statsBar"></div>

      <!-- Table -->
      <div class="table-wrapper">
        <table class="bookings-table" id="bookingsTable">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Phone</th>
              <th>Date</th>
              <th>Time</th>
              <th>Status</th>
              <th>Driver</th>
              <th>Booked At</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="bookingsBody">
          </tbody>
        </table>
        <div id="emptyState" class="empty-state hidden">
          <div class="empty-icon">📋</div>
          <p>No bookings found.</p>
        </div>
      </div>
    </div>
  </main>

  <!-- SMS Toast -->
  <div id="smsToast" class="sms-toast hidden"></div>

  <!-- Confirm delete modal -->
  <div id="deleteModal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-icon">⚠️</div>
      <h2>Delete Booking?</h2>
      <p>This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=4"></script>
  <script src="admin.js?v=4"></script>
  <script>
    // Show login screen on load; hide if already authenticated this session
    if (sessionStorage.getItem('totahda_admin') === '1') {
      document.getElementById('adminLoginScreen').style.display = 'none';
      document.getElementById('adminMain').style.display = '';
    }
    function adminLogin() {
      const pin = document.getElementById('adminPin').value.trim();
      const err = document.getElementById('err-adminPin');
      if (pin === '100') {
        sessionStorage.setItem('totahda_admin', '1');
        document.getElementById('adminLoginScreen').style.display = 'none';
        document.getElementById('adminMain').style.display = '';
        renderBookings();
      } else {
        document.getElementById('adminPin').classList.add('invalid');
        err.textContent = 'Incorrect PIN. Please try again.';
      }
    }
    document.getElementById('adminPin').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') adminLogin();
    });
  </script>
</body>
</html>
